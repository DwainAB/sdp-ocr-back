# Dépendances système requises par WeasyPrint (génération de PDF) :
# Pango/Cairo/GDK-Pixbuf pour le rendu du texte et des images dans les PDF.
# Sans ça, `import weasyprint` échoue au démarrage (OSError: cannot load
# library 'gobject-2.0-0').
[phases.setup]
aptPkgs = [
  "libpango-1.0-0",
  "libpangocairo-1.0-0",
  "libcairo2",
  "libgdk-pixbuf2.0-0",
  "libffi-dev",
  "shared-mime-info",
  "fonts-liberation",
]
